<svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 56 56">
<style>
  .a{animation-duration:7s;animation-delay:2.75s;animation-iteration-count:infinite;animation-timing-function:ease-in-out;transform-box:fill-box;transform-origin:center}
  .tile{animation-name:tile}
  @keyframes tile{0%,20%,100%{fill-opacity:.12;stroke-opacity:.4}8%{fill-opacity:.24;stroke-opacity:.9}}
  @keyframes inn{0%,20%,100%{transform:none}5%{transform:scale(1.25)}10%{transform:scale(.92)}15%{transform:scale(1.06)}}.inn{animation-name:inn}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect class="a tile" x="1" y="1" width="54" height="54" rx="14" fill="#14B8A6" fill-opacity=".12" stroke="#14B8A6" stroke-opacity=".4"/>
<g transform="translate(16 16)" fill="none" stroke="#14B8A6" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
<rect x="2.5" y="2.5" width="19" height="19" rx="3.5"/><g class="a inn"><path d="M7.5 10.5V17"/><circle cx="7.5" cy="7.2" r="0.6" fill="#14B8A6"/><path d="M11.5 17V10.5M11.5 13.3C11.5 11.6 12.7 10.4 14.3 10.4S16.8 11.5 16.8 13.2V17"/></g>
</g>
</svg>
