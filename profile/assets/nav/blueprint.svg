<svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 56 56">
<style>
  .a{animation-duration:7s;animation-delay:1.65s;animation-iteration-count:infinite;animation-timing-function:ease-in-out;transform-box:fill-box;transform-origin:center}
  .tile{animation-name:tile}
  @keyframes tile{0%,20%,100%{fill-opacity:.12;stroke-opacity:.4}8%{fill-opacity:.24;stroke-opacity:.9}}
  @keyframes pin{0%,24%,100%{transform:translate(0,0)}6%{transform:translate(6px,-5px)}12%{transform:translate(12px,-1px)}18%{transform:translate(12px,-9px)}}.pin{animation-name:pin}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect class="a tile" x="1" y="1" width="54" height="54" rx="14" fill="#14B8A6" fill-opacity=".12" stroke="#14B8A6" stroke-opacity=".4"/>
<g transform="translate(16 16)" fill="none" stroke="#14B8A6" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
<path d="M3 6 L9 3.5 L15 6 L21 3.5 V18 L15 20.5 L9 18 L3 20.5 Z"/><path d="M9 3.5V18M15 6V20.5"/><circle class="a pin" cx="6" cy="15" r="1.6" fill="#14B8A6" stroke="none"/>
</g>
</svg>
