<svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 56 56">
<style>
  .a{animation-duration:7s;animation-delay:0.55s;animation-iteration-count:infinite;animation-timing-function:ease-in-out;transform-box:fill-box;transform-origin:center}
  .tile{animation-name:tile}
  @keyframes tile{0%,20%,100%{fill-opacity:.12;stroke-opacity:.4}8%{fill-opacity:.24;stroke-opacity:.9}}
  @keyframes big{0%,20%,100%{transform:none}8%{transform:rotate(90deg) scale(1.2)}}.big{animation-name:big}@keyframes sm{0%,20%,100%{transform:none}12%{transform:scale(1.5)}}.sm{animation-name:sm}@keyframes tw{0%,20%,100%{opacity:1}5%,15%{opacity:.1}10%{opacity:1}}.tw{animation-name:tw}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect class="a tile" x="1" y="1" width="54" height="54" rx="14" fill="#14B8A6" fill-opacity=".12" stroke="#14B8A6" stroke-opacity=".4"/>
<g transform="translate(16 16)" fill="none" stroke="#14B8A6" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
