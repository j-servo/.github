<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="120" viewBox="0 0 1280 120" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<style>

.wave{animation:wave 8s linear infinite}
@keyframes wave{to{transform:translateX(-160px)}}
.dot{transform-box:fill-box;transform-origin:center;animation:d 2s ease-in-out infinite}
@keyframes d{50%{transform:scale(1.8);opacity:.3}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06121A"/><stop offset="1" stop-color="#0B2A2E"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity=".045"/></pattern>
  <linearGradient id="sheen" x1="0" x2="1"><stop offset="0" stop-color="#19C2AE" stop-opacity="0"/><stop offset=".5" stop-color="#19C2AE" stop-opacity=".16"/><stop offset="1" stop-color="#19C2AE" stop-opacity="0"/></linearGradient>
</defs>
<clipPath id="c"><rect width="1280" height="120"/></clipPath>
<g clip-path="url(#c)"><path class="wave" d="M-160 30 q40 -18 80 0 t80 0 q40 -18 80 0 t80 0 q40 -18 80 0 t80 0 q40 -18 80 0 t80 0 q40 -18 80 0 t80 0 q40 -18 80 0 t80 0 q40 -18 80 0 t80 0 q40 -18 80 0 t80 0 q40 -18 80 0 t80 0 q40 -18 80 0 t80 0" fill="none" stroke="#19C2AE" stroke-opacity=".45" stroke-width="2"/><path class="wave" style="animation-duration:12s" d="M-160 30 q40 -18 80 0 t80 0 q40 -18 80 0 t80 0 q40 -18 80 0 t80 0 q40 -18 80 0 t80 0 q40 -18 80 0 t80 0 q40 -18 80 0 t80 0 q40 -18 80 0 t80 0 q40 -18 80 0 t80 0 q40 -18 80 0 t80 0 q40 -18 80 0 t80 0" transform="translate(0 10)" fill="none" stroke="#19C2AE" stroke-opacity=".18" stroke-width="2"/></g>
<text x="640" y="84" font-size="26" font-weight="700" letter-spacing="3" text-anchor="middle" fill="#FFFFFF">J. SERVO</text>
<circle class="dot" cx="526" cy="76" r="4" fill="#19C2AE"/><circle class="dot" style="animation-delay:1s" cx="754" cy="76" r="4" fill="#19C2AE"/>
