<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="330" viewBox="0 0 1280 330" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<style>

.comet{animation:comet 10s linear infinite}
@keyframes comet{0%{transform:translateX(0);opacity:1}80%{transform:translateX(1024px);opacity:1}84%,100%{transform:translateX(1024px);opacity:0}}
.halo{transform-box:fill-box;transform-origin:center;opacity:0;animation:halo 10s ease-out infinite}
@keyframes halo{0%{opacity:.55;transform:scale(1)}9%{opacity:0;transform:scale(2.1)}100%{opacity:0}}
.node{animation:node 10s ease-in-out infinite}
@keyframes node{0%,12%,100%{fill-opacity:.12}3%{fill-opacity:.55}}
.flow{stroke-dasharray:6 10;animation:flow 1.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-16}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7FBFB"/><stop offset="1" stop-color="#E3F1EF"/></linearGradient>
