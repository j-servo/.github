<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="250" viewBox="0 0 1280 250" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<style>

.std{animation:std 7.5s ease-in-out infinite}
@keyframes std{0%,18%,100%{fill-opacity:.1;stroke-opacity:.35}7%{fill-opacity:.35;stroke-opacity:1}}
.grow{transform-box:fill-box;transform-origin:bottom;animation:grow 7s ease-in-out infinite}
@keyframes grow{0%,40%,100%{transform:none}15%{transform:scaleY(.2)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06121A"/><stop offset="1" stop-color="#0B2A2E"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity=".045"/></pattern>
  <linearGradient id="sheen" x1="0" x2="1"><stop offset="0" stop-color="#19C2AE" stop-opacity="0"/><stop offset=".5" stop-color="#19C2AE" stop-opacity=".16"/><stop offset="1" stop-color="#19C2AE" stop-opacity="0"/></linearGradient>
</defs>
<rect width="1280" height="250" rx="18" fill="url(#bg)"/><rect width="1280" height="250" rx="18" fill="url(#grid)"/>
<line x1="640" y1="32" x2="640" y2="218" stroke="#FFFFFF" stroke-opacity=".08"/>
<text x="44" y="52" font-size="13" font-weight="600" letter-spacing="3" fill="#19C2AE">FIVE STANDARDS</text>
