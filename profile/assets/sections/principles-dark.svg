<text x="318" y="214" font-size="15" font-weight="600" text-anchor="middle" fill="#FFFFFF">Visibility</text>
<polygon class="std" style="animation-delay:4.5s" points="431.0,116.0 460.4,133.0 460.4,167.0 431.0,184.0 401.6,167.0 401.6,133.0" fill="#19C2AE" fill-opacity=".1" stroke="#19C2AE" stroke-opacity=".35" stroke-width="2"/>
